<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ZenMind</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zenGreen: '#2D5A27',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body
    class="bg-softCream dark:bg-slate-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-200">

    <div class="max-w-md w-full animate__animated animate__zoomIn">
        <div class="flex items-center justify-center mb-8">
            <a href="index.html" class="flex items-center gap-3 group">
                <div
                    class="w-16 h-16 bg-zenGreen rounded-2xl flex items-center justify-center text-white font-bold text-3xl group-hover:scale-110 transition-transform shadow-lg">
                    M</div>
                <span class="brand-name brand-font text-green-800 dark:text-green-400 text-3xl">ZenMind</span>
            </a>
        </div>

        <div class="card-premium bg-white dark:bg-slate-800 p-8 shadow-2xl">
            <h1 class="text-2xl font-bold mb-6 text-center dark:text-white">Create Account</h1>

            <form class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold mb-1 dark:text-slate-300">First Name</label>
                        <input type="text"
                            class="w-full px-4 py-2 text-sm rounded-lg border focus:border-zenGreen outline-none dark:bg-slate-900 dark:text-white"
                            placeholder="John" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1 dark:text-slate-300">Last Name</label>
                        <input type="text"
                            class="w-full px-4 py-2 text-sm rounded-lg border focus:border-zenGreen outline-none dark:bg-slate-900 dark:text-white"
                            placeholder="Doe" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1 dark:text-slate-300">Email Address</label>
                    <input type="email"
                        class="w-full px-4 py-2 text-sm rounded-lg border focus:border-zenGreen outline-none dark:bg-slate-900 dark:text-white"
                        placeholder="you@example.com" required>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1 dark:text-slate-300">Password</label>
                    <input type="password"
                        class="w-full px-4 py-2 text-sm rounded-lg border focus:border-zenGreen outline-none dark:bg-slate-900 dark:text-white"
                        placeholder="••••••••" required>
                </div>
                <p class="text-[10px] text-slate-500">By signing up, you agree to our <a href="terms.html"
                        class="text-zenGreen">Terms</a> and <a href="privacy.html" class="text-zenGreen">Privacy
                        Policy</a>.</p>
                <button type="submit"
                    class="btn-consistent bg-zenGreen text-white w-full hover:bg-green-800 hover-lift text-lg mt-4"
                    onclick="window.location.href='user-dashboard.html'; return false;">
                    Create Free Account
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                </div>
                <div class="relative flex justify-center text-[10px] uppercase"><span
                        class="bg-white dark:bg-slate-800 px-2 text-slate-500">Or sign up with</span></div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button
                    class="flex items-center justify-center gap-2 px-4 py-2 border rounded-lg hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-700 transition-colors">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4">
                    <span class="text-xs font-semibold dark:text-slate-200">Google</span>
                </button>
                <button
                    class="flex items-center justify-center gap-2 px-4 py-2 border rounded-lg hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-700 transition-colors">
                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="w-4 h-4">
                    <span class="text-xs font-semibold dark:text-slate-200">Facebook</span>
                </button>
            </div>

            <p class="text-center mt-6 text-sm text-slate-600 dark:text-slate-400">
                Already have an account? <a href="login.html" class="text-zenGreen font-bold hover:underline">Sign
                    in</a>
            </p>
        </div>
    </div>
</body>

</html>
