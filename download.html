<!DOCTYPE html>
<html lang="en" class="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App | ZenMind Meditation App</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zenGreen: '#2D5A27',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-softCream dark:bg-slate-900 transition-colors duration-200 text-slate-900 dark:text-white">

    <main class="min-h-screen flex flex-col items-center justify-center py-24 px-4">
        <div class="max-w-4xl w-full text-center">
            <h1 class="text-5xl md:text-7xl font-bold mb-8">Zen in Your Pocket</h1>
            <p class="text-xl md:text-2xl mb-12 text-slate-600 dark:text-slate-400 font-medium">Download the top-rated
                meditation app and start your free trial today.</p>

            <div class="flex flex-col md:flex-row justify-center items-center gap-12 mb-20">
                <div class="space-y-6">
                    <a href="#" class="block hover-lift"><img
                            src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg"
                            alt="App Store" class="h-16"></a>
                    <a href="#" class="block hover-lift"><img
                            src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
                            alt="Google Play" class="h-16"></a>
                </div>

                <div class="hidden md:block w-px h-32 bg-slate-200 dark:bg-slate-800"></div>

                <div class="flex flex-col items-center gap-4">
                    <div
                        class="w-40 h-40 bg-white p-2 rounded-2xl shadow-xl border-4 border-zenGreen group cursor-pointer hover:rotate-3 transition-transform">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://zenmind.app"
                            alt="QR Code" class="w-full h-full">
                    </div>
                    <p class="text-sm font-bold text-zenGreen">Scan to Download</p>
                </div>
            </div>

            <!-- Email Link Form -->
            <div class="card-premium max-w-lg mx-auto bg-white/50 dark:bg-slate-800/50 backdrop-blur-sm">
                <h3 class="text-xl font-bold mb-4">Email the link to your phone</h3>
                <form class="flex flex-col sm:flex-row gap-2">
                    <input type="email" placeholder="Enter your email"
                        class="flex-grow px-4 py-2 rounded-lg border focus:border-zenGreen outline-none dark:bg-slate-900 w-full"
                        required>
                    <button type="submit"
                        class="btn-consistent bg-zenGreen text-white px-6 rounded-lg whitespace-nowrap w-full sm:w-auto">Send
                        Link</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/components.js"></script>
</body>

</html>
